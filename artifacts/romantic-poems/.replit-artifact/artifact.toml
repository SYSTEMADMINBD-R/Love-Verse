kind = "web"
previewPath = "/"
title = "Romantic Poem Website"
version = "1.0.0"
id = "artifacts/romantic-poems"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25534

[services.development]
run = "pnpm --filter @workspace/romantic-poems run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/romantic-poems", "run", "build" ]
publicDir = "artifacts/romantic-poems/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25534"
BASE_PATH = "/"
